function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function val(id){return document.getElementById(id).value}function q(){return(document.getElementById('search').value||'').toLowerCase()}function rows(){let s=q();return db.loads.filter(x=>JSON.stringify(x).toLowerCase().includes(s))}function fmt(v){if(!v)return'';let d=new Date(v);return isNaN(d)?v:d.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}function badge(s){let c=['Delivered','Active'].includes(s)?'g':['Delayed','Offline'].includes(s)?'r':['At Pickup','At Delivery','Needs Activation'].includes(s)?'o':['In Transit','Loaded'].includes(s)?'b':'';return`<span class="badge ${c}"><i class="dot"></i>${esc(s||'—')}</span>`}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function go(p){location.hash=p;render()}function heading(h,p,b=true){return`<div class="title"><div><h1>${h}</h1><p>${p}</p></div>${b?'<button class="btn primary" onclick="newLoad()">＋ New Load</button>':''}</div>`}
function table(a){if(!a.length)return'<div class="empty">No matching loads.</div>';return`<div class="tablewrap"><table><thead><tr><th>Load</th><th>Customer</th><th>Carrier / Driver</th><th>Route</th><th>Status</th><th>Tracking</th><th>Current Location</th><th>ETA</th></tr></thead><tbody>${a.map(x=>`<tr><td><span class="link" onclick="openDrawer('${x.id}')">#${esc(x.load)}</span></td><td>${esc(x.customer)}</td><td>${esc(x.carrier)}<br><span class="sub">${esc(x.driver||'')}</span></td><td>${esc(x.pickup)} → ${esc(x.delivery)}</td><td><select class="status-select" onchange="setLoadStatus('${x.id}',this.value)">${STATUS.map(st=>`<option ${x.status===st?'selected':''}>${st}</option>`).join('')}</select></td><td>${badge(x.tracking)}</td><td><span class="loc-chip" onclick="quickLocation('${x.id}')">${esc(x.location||'—')} ✎</span></td><td>${esc(fmt(x.eta)||'—')}</td></tr>`).join('')}</tbody></table></div>`}

n Workbench</button></div>${table(rows().slice(0,12))}</div>`}
function workbench(){let a=db.loads,active=a.filter(x=>x.status!=='Delivered').length,attention=a.filter(x=>x.status==='Delayed'||x.tracking!=='Active'||/pending|keep an eye|no response|tracking needs/i.test(x.notes||''));let tasks=a.flatMap(x=>(x.tasks||[]).map(t=>({...t,loadId:x.id,load:x.load,customer:x.customer}))).filter(t=>t.status!=='Completed').slice(0,8);document.getElementById('app').innerHTML=heading('Workbench','Active freight, tasks and customer visibility')+`<div class="cards"><div class="card"><label>Active Loads</label><b>${active}</b></div><div class="card blue"><label>In Transit</label><b>${a.filter(x=>x.status==='In Transit').length}</b></div><div class="card good"><label>Tracking Active</label><b>${a.filter(x=>x.tracking==='Active').length}</b></div><div class="card warn"><label>At Pickup</label><b>${a.filter(x=>x.status==='At Pickup').length}</b></div><div class="card bad"><label>Delayed</label><b>${a.filter(x=>x.status==='Delayed').length}</b></div><div class="card bad"><label>Tracking Issues</label><b>${a.filter(x=>x.tracking!=='Active').length}</b></div></div><div class="split"><div class="panel"><div class="panelhead"><b>Needs Attention</b><button class="btn sm" onclick="go('exceptions')">View all</button></div>${table(attention)}</div><div class="panel"><div class="panelhead"><b>Open Tasks</b><button class="btn sm" onclick="go('loads')">View loads</button></div><div style="padding:10px">${tasks.map(t=>`<div class="taskrow"><div class="taskmeta"><b class="link" onclick="shipment('${t.loadId}')">#${esc(t.load)} • ${esc(t.title)}</b><span class="sub">${esc(t.customer)}</span></div><div class="taskactions"><select class="status-select" onchange="setTaskStatus('${t.loadId}','${t.id}',this.value)">${['Open','In Progress','Blocked','Completed'].map(st=>`<option ${t.status===st?'selected':''}>${st}</option>`).join('')}</select></div></div>`).join('')||'<div class="empty">No open tasks.</div>'}</div></div></div><div class="panel"><div class="panelhead"><b>Customer Pulse</b><span class="sub">Live sample workspace</span></div><div style="padding:12px"><div class="customer-grid">${db.customers.map(c=>{let z=a.filter(x=>x.customer===c.name);return`<div class="customer-chip customer" onclick="customerPage('${esc(c.name)}')"><b>${esc(c.name)}</b><small>${z.length} loads • ${z.filter(x=>x.status==='In Transit').length} in transit • ${z.filter(x=>x.status==='Delayed').length} delayed</small></div>`}).join('')}</div></div></div><div class="panel"><div class="panelhead"><b>Recent / Active Loads</b><button class="btn sm" onclick="go('loads')">Open Workbench</button></div>${table(rows().slice(0,14))}</div>`}
function carriers(){let m={};db.loads.forEach(x=>{if(x.carrier)m[x.carrier]=(m[x.carrier]||0)+1});document.getElementById('app').innerHTML=heading('Carriers','Carrier and driver visibility')+`<div class="grid3">${Object.keys(m).map(n=>`<div class="panel"><div style="padding:15px"><h3 style="margin:0">${esc(n)}</h3><p class="sub">${m[n]} load(s)</p><button class="btn sm" onclick="document.getElementById('search').value='${esc(n)}';go('loads')">View loads</button></div></div>`).join('')}</div>`}function exceptions(){let a=db.loads.filter(x=>x.status==='Delayed'||x.tracking!=='Active'||/pending|offline|keep an eye/i.test(x.notes||''));document.getElementById('app').innerHTML=heading('Exceptions','Loads requiring Support action')+`<div class="panel"><div class="panelhead"><b>${a.length} exception(s)</b></div>${table(a)}</div>`}function tracking(){let a=db.loads.filter(x=>x.status!=='Delivered');document.getElementById('app').innerHTML=heading('Tracking Control Tower','Location, status and ETA workspace')+`<div class="panel"><div style="padding:12px"><div class="map"><div class="pin p1">P</div><div class="pin p2">D</div></div></div>${table(a)}</div>`}function handoffs(){let a=db.loads.filter(x=>x.handoff);document.getElementById('app').innerHTML=heading('Handoffs','Next-shift action queue')+`<div class="panel">${a.map(x=>`<div class="note" style="margin:9px 12px;border-left:3px solid var(--red)"><b class="link" onclick="openDrawer('${x.id}')">#${esc(x.load)} • ${esc(x.customer)}</b><p style="margin:5px 0">${esc(x.handoff)}</p><span class="sub">${esc(x.status)} • ${esc(x.updated||'')}</span></div>`).join('')||'<div class="empty">No handoffs.</div>'}</div>`}
function documents(){document.getElementById('app').innerHTML=heading('Documents','BOL / POD and shipment document register')+`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="uploadDocument()">＋ Upload Document</button></div>${db.documents.length?`<div style="padding:10px">${db.documents.map(d=>`<div class="doc"><div><b>${esc(d.file)}</b><div class="sub">#${esc(d.load)} • ${esc(d.type)} • ${esc(d.date)}</div></div><button class="btn sm" onclick="downloadDocument('${d.id}')">Download</button></div>`).join('')}</div>`:'<div class="empty">No documents uploaded.</div>'}</div>`}
function analytics(){let a=db.loads,n=a.length;document.getElementById('app').innerHTML=heading('Analytics','Operational snapshot',false)+`<div class="cards"><div class="card"><label>Total Loads</label><b>${n}</b></div><div class="card"><label>Delivered</label><b class="good">${a.filter(x=>x.status==='Delivered').length}</b></div><div class="card"><label>In Transit</label><b class="blue">${a.filter(x=>x.status==='In Transit').length}</b></div><div class="card"><label>Delayed</label><b class="bad">${a.filter(x=>x.status==='Delayed').length}</b></div><div class="card"><label>Tracking Active</label><b class="good">${a.filter(x=>x.tracking==='Active').length}</b></div><div class="card"><label>Customers</label><b>${db.customers.length}</b></div></div><div class="panel"><div class="panelhead"><b>Status Distribution</b></div><div style="padding:14px">${STATUS.map(s=>{let k=a.filter(x=>x.status===s).length;return`<div style="display:flex;align-items:center;gap:9px;margin:8px 0"><span style="width:100px">${s}</span><div style="height:10px;background:#e9edf1;border-radius:5px;flex:1"><div style="height:100%;width:${n?Math.max(k?2:0,k/n*100):0}%;background:#374151;border-radius:5px"></div></div><b>${k}</b></div>`}).join('')}</div></div>`}
function importPage(){document.getElementById('app').innerHTML=heading('Turvo Import','Preview and import exported Turvo CSV data',false)+`<div class="panel"><div style="padding:16px"><div class="importbox"><label for="csv"><b>Choose Turvo CSV</b><br><span class="sub">Duplicate load numbers are skipped. Common Turvo field names are mapped automatically.</span><br><br><span class="btn primary">Select CSV</span></label><input id="csv" type="file" accept=".csv" onchange="previewCSV(event)"></div><div id="preview"></div></div></div><div class="panel"><div class="panelhead"><b>Mapping</b></div><div style="padding:14px;line-height:1.8;color:#5f6b7a">Load / Shipment Number → Load · Customer → Customer · Carrier → Carrier · Driver → Driver · Origin / Pickup → Pickup · Destination / Delivery → Delivery · Status → Status · Tracking → Tracking · Location → Location · ETA → ETA · Notes / Comments → Notes.</div></div>`}
function parseCSV(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let ch=t[i];if(ch==='"'&&t[i+1]==='"'){c+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===','&&!q){r.push(c);c='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))a.push(r);r=[];continue}c+=ch}if(c||r.length){r.push(c);a.push(r)}return a}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9#]/g,'')}function getc(r,h,keys){for(let k of keys){let i=h.findIndex(x=>norm(x)===norm(k));if(i>=0&&r[i])return r[i].trim()}return''}function normalizeStatus(s){let x=(s||'').toLowerCase();if(x.includes('deliver'))return x.includes('at')?'At Delivery':'Delivered';if(x.includes('transit'))return'In Transit';if(x.includes('pickup'))return'At Pickup';if(x.includes('load'))return'Loaded';if(x.includes('delay'))return'Delayed';return'Dispatched'}function normalizeTracking(s){let x=(s||'').toLowerCase();if(x.includes('offline')||x.includes('inactive'))return'Offline';if(x.includes('need'))return'Needs Activation';if(x.includes('active'))return'Active';return s?'Active':'Needs Activation'}function previewCSV(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{window.csvData=parseCSV(rd.result);let a=window.csvData;if(a.length<2)return;let dup=0;for(let r of a.slice(1)){let l=getc(r,a[0],['Load #','Load','Shipment','Shipment Number']);if(l&&db.loads.some(x=>String(x.load)===String(l)))dup++}document.getElementById('preview').innerHTML=`<div class="panel" style="margin-top:14px;box-shadow:none"><div class="panelhead"><b>Preview</b><span>${a.length-1} row(s) • ${dup} duplicate(s)</span></div>${tableCSV(a)}<div class="toolbar"><button class="btn primary" onclick="importTurvo()">Import valid loads</button></div></div>`};rd.readAsText(f)}function tableCSV(a){let h=a[0];return`<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${a.slice(1,7).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function importTurvo(){let a=window.csvData;if(!a)return;let h=a[0],seen=new Set(db.loads.map(x=>String(x.load))),added=0,skipped=0;a.slice(1).forEach((r,i)=>{if(!r.join('').trim())return;let l=getc(r,h,['Load #','Load','Shipment','Shipment Number']);if(!l||seen.has(String(l))){skipped++;return}let customer=getc(r,h,['Customer','Customer Name'])||'Unknown';let x={id:'imp'+Date.now()+i,load:l,customer,carrier:getc(r,h,['Carrier','Carrier Name']),driver:getc(r,h,['Driver','Driver Name']),phone:getc(r,h,['Phone','Driver Phone']),equipment:getc(r,h,['Equipment'])||'Dry Van',pickup:getc(r,h,['Pickup','Origin','Pickup Location']),delivery:getc(r,h,['Delivery','Destination','Delivery Location']),pu:getc(r,h,['Pickup Appointment']),del:getc(r,h,['Delivery Appointment']),status:normalizeStatus(getc(r,h,['Status'])),tracking:normalizeTracking(getc(r,h,['Tracking','Tracking Status'])),location:getc(r,h,['Current Location','Location']),eta:getc(r,h,['ETA']),notes:getc(r,h,['Notes','Comments']),handoff:'',updated:'Imported',events:[['Imported from Turvo CSV','Just now']],po:getc(r,h,['PO','PO #','Reference']),value:Number(getc(r,h,['Customer Bill','Customer Bill Amount'])||0),carrierPay:Number(getc(r,h,['Carrier Pay','Carrier Payable'])||0),margin:0,appointment:getc(r,h,['Appointment','Scheduling'])};x.margin=x.value-x.carrierPay;db.loads.unshift(x);seen.add(String(l));added++});save();toast(`${added} imported • ${skipped} skipped`);go('loads')}
function newLoad(customer=''){document.getElementById('mtitle').textContent='New Load';document.getElementById('mbody').innerHTML=form(null,customer);document.getElementById('modal').classList.add('show')}function form(x,c=''){let v=k=>x?esc(x[k]??''):k==='customer'?esc(c):'';return`<form onsubmit="saveLoad(event)"><input type="hidden" id="fid" value="${x?x.id:''}"><div class="formgrid"><div class="field"><label>Load #</label><input id="fload" required value="${v('load')}"></div><div class="field"><label>Customer</label><input id="fcustomer" list="cust" required value="${v('customer')}"><datalist id="cust">${db.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div class="field"><label>Carrier</label><input id="fcarrier" value="${v('carrier')}"></div><div class="field"><label>Driver</label><input id="fdriver" value="${v('driver')}"></div><div class="field"><label>Driver Phone</label><input id="fphone" value="${v('phone')}"></div><div class="field"><label>Equipment</label><select id="fequip">${['Van','Dry Van','Reefer','Flatbed','Power Only','Other'].map(a=>`<option ${v('equipment')===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Pickup</label><input id="fpickup" value="${v('pickup')}"></div><div class="field"><label>Delivery</label><input id="fdelivery" value="${v('delivery')}"></div><div class="field"><label>Pickup Appointment</label><input id="fpu" type="datetime-local" value="${v('pu')}"></div><div class="field"><label>Delivery Appointment</label><input id="fdel" type="datetime-local" value="${v('del')}"></div><div class="field"><label>Status</label><select id="fstatus">${STATUS.map(a=>`<option ${v('status')===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Tracking</label><select id="ftracking">${['Active','Needs Activation','Offline','N/A'].map(a=>`<option ${v('tracking')===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Current Location</label><input id="flocation" value="${v('location')}"></div><div class="field"><label>ETA</label><input id="feta" type="datetime-local" value="${v('eta')}"></div><div class="field"><label>Customer Bill</label><input id="fvalue" type="number" step=".01" value="${v('value')}"></div><div class="field"><label>Carrier Pay</label><input id="fpay" type="number" step=".01" value="${v('carrierPay')}"></div><div class="field"><label>PO / Reference</label><input id="fpo" value="${v('po')}"></div><div class="field"><label>Scheduling</label><input id="fappt" value="${v('appointment')}"></div><div class="field full"><label>Support Notes</label><textarea id="fnotes">${v('notes')}</textarea></div><div class="field full"><label>Handoff / Next Action</label><textarea id="fhandoff">${v('handoff')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Load</button></div></form>`}
function saveLoad(e){e.preventDefault();let id=val('fid')||Date.now().toString(),old=db.loads.find(x=>x.id===id),x={id,load:val('fload'),customer:val('fcustomer'),carrier:val('fcarrier'),driver:val('fdriver'),phone:val('fphone'),equipment:val('fequip'),pickup:val('fpickup'),delivery:val('fdelivery'),pu:val('fpu'),del:val('fdel'),status:val('fstatus'),tracking:val('ftracking'),location:val('flocation'),eta:val('feta'),value:Number(val('fvalue')||0),carrierPay:Number(val('fpay')||0),margin:Number(val('fvalue')||0)-Number(val('fpay')||0),po:val('fpo'),appointment:val('fappt'),notes:val('fnotes'),handoff:val('fhandoff'),updated:'Just now',events:old?.events||[['Load created','Just now']]};if(old){if(old.status!==x.status)x.events.unshift([`Status changed to ${x.status}`,'Just now']);if(old.tracking!==x.tracking)x.events.unshift([`Tracking changed to ${x.tracking}`,'Just now']);db.loads=db.loads.map(a=>a.id===id?x:a)}else db.loads.unshift(x);if(x.customer&&!db.customers.some(c=>c.name===x.customer))db.customers.push({name:x.customer,code:x.customer.slice(0,3).toUpperCase(),tracking:'Required',equipment:x.equipment,docs:'BOL, POD',instructions:'Verify customer-specific requirements.',phone:''});if(x.carrier&&!db.carriers.includes(x.carrier))db.carriers.push(x.carrier);save();closeModal();render();toast('Load saved')}
function openDrawer(id){let x=db.loads.find(a=>a.id===id);if(!x)return;document.getElementById('dtitle').textContent=`#${x.load} • ${x.customer}`;document.getElementById('dsub').textContent=`Transportation shipment • ${x.carrier||'No carrier'}`;document.getElementById('dbody').innerHTML=`${badge(x.status)} ${badge(x.tracking)}<div class="dactions"><button class="btn primary sm" onclick="shipment('${x.id}')">Open shipment</button><button class="btn sm" onclick="editLoad('${x.id}')">Edit</button><button class="btn sm" onclick="quickStatus('${x.id}')">Update status</button><button class="btn sm" onclick="quickTracking('${x.id}')">Tracking</button></div><div class="map"><div class="pin p1">P</div><div class="pin p2">D</div></div><div class="note"><b>${esc(x.pickup)}</b> → <b>${esc(x.delivery)}</b><br><span class="sub">Current: ${esc(x.location||'—')} • ETA: ${esc(fmt(x.eta)||'—')}</span></div><div class="mini"><div><label>Driver</label>${esc(x.driver||'—')}</div><div><label>Phone</label>${esc(x.phone||'—')}</div><div><label>Pickup</label>${esc(fmt(x.pu)||'—')}</div><div><label>Delivery</label>${esc(fmt(x.del)||'—')}</div><div><label>Customer Bill</label>$${Number(x.value||0).toLocaleString()}</div><div><label>Margin</label>$${Number(x.margin||0).toLocaleString()}</div></div><div class="note"><b>Latest Support Note</b><br>${esc(x.notes||'No notes')}</div><div class="note" style="border-left:3px solid var(--red)"><b>Handoff</b><br>${esc(x.handoff||'No handoff')}</div><h3 style="font-size:12px">Recent Activity</h3><div class="timeline">${(x.events||[]).slice(0,7).map(e=>`<div class="event"><b>${esc(e[0])}</b><small>${esc(e[1])}</small></div>`).join('')}</div>`;document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}function quickStatus(id){let x=db.loads.find(a=>a.id===id),n=prompt('New status:',x.status);if(!n||!STATUS.includes(n))return alert(STATUS.join(', '));x.status=n;x.updated='Just now';x.events.unshift([`Status changed to ${n}`,'Just now']);save();openDrawer(id);render();toast('Status updated')}function quickTracking(id){let x=db.loads.find(a=>a.id===id),n=prompt('Tracking state:',x.tracking);if(!n||!['Active','Needs Activation','Offline','N/A'].includes(n))return alert('Active / Needs Activation / Offline / N/A');x.tracking=n;x.updated='Just now';x.events.unshift([`Tracking changed to ${n}`,'Just now']);save();openDrawer(id);render();toast('Tracking updated')}
function shipment(id){closeDrawer();currentShipmentId=id;let x=db.loads.find(a=>a.id===id);document.getElementById('app').innerHTML=`<div class="title"><div><button class="btn sm" onclick="go('loads')">← Loads</button><h1 style="margin-top:10px">Shipment #${esc(x.load)}</h1><p>${esc(x.customer)} • ${esc(x.carrier||'No carrier')}</p></div><div>${badge(x.status)} ${badge(x.tracking)} <button class="btn primary" onclick="editLoad('${x.id}')">Edit shipment</button></div></div><div class="shipment"><div class="shiptop"><div class="shipleft"><div class="identity"><h2>${esc(x.customer)}</h2><span class="sub">Transportation shipment</span></div><div style="padding:11px"><b>${esc(x.pickup)}</b><div class="sub">→ ${esc(x.delivery)}</div><div class="note"><b>${esc(x.location||'Location not provided')}</b><br><span class="sub">ETA ${esc(fmt(x.eta)||'Not set')}</span></div></div></div><div class="shipmap"><div class="line"></div><div class="rp rp1">P</div><div class="rp rp2">D</div></div></div><div class="tabs" id="stabs">${['Summary','Details','Timeline','Orders','Messenger','Documents','Notes','Contacts','Sharing','Carriers','Tasks'].map((t,i)=>`<button class="${i?'':'active'}" onclick="stab('${x.id}','${t}',this)">${t}</button>`).join('')}</div><div class="tabbody" id="stabbody">${stabhtml(x,'Summary')}</div></div>`;let qc=document.getElementById('quick-context');if(qc)qc.innerHTML=`<b>Shipment #${esc(x.load)}</b> • ${esc(x.customer)}`;window.scrollTo(0,0)}
function stab(id,t,b){document.querySelectorAll('#stabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let x=db.loads.find(a=>a.id===id);document.getElementById('stabbody').innerHTML=stabhtml(x,t)}function stabhtml(x,t){if(t==='Summary')return`<div class="grid3"><div><h3>Overview</h3><div class="info"><div><label>Pickup</label>${esc(x.pickup)}</div><div><label>Delivery</label>${esc(x.delivery)}</div><div><label>Pickup appointment</label>${esc(fmt(x.pu)||'—')}</div><div><label>Delivery appointment</label>${esc(fmt(x.del)||'—')}</div><div><label>Scheduling</label>${esc(x.appointment||'—')}</div><div><label>Equipment</label>${esc(x.equipment||'—')}</div></div></div><div><h3>Route</h3><div class="routebox"><div class="stop"><i class="sdot done"></i><div><b>${esc(x.pickup)}</b><div class="sub">Pickup • ${esc(fmt(x.pu)||'Time not set')}</div></div></div><div class="stop"><i class="sdot"></i><div><b>${esc(x.delivery)}</b><div class="sub">Delivery • ${esc(fmt(x.del)||'Time not set')}</div></div></div></div><div class="section-label">Current position</div><div class="upload-card"><b>${esc(x.location||'Location not provided')}</b><div class="sub">Click the ★ quick-actions button to update manually.</div></div></div><div><h3>Costs</h3><div class="costs"><div class="cost">Customer bill <b>$${Number(x.value||0).toLocaleString()}</b></div><div class="cost">Carrier pay <b>$${Number(x.carrierPay||0).toLocaleString()}</b></div><div class="cost">Margin <b>$${Number(x.margin||0).toLocaleString()}</b></div><div class="cost">Margin % <b>${x.value?Math.round(x.margin/x.value*100)+'%':'—'}</b></div></div><h3>Customer</h3><div class="note"><b>${esc(x.customer)}</b><br><span class="sub">PO / Reference: ${esc(x.po||'—')}</span></div></div></div><div class="section-label">Documents</div><div class="panel" style="box-shadow:none"><div class="panelhead"><b>Recent documents</b><button class="btn primary sm" onclick="uploadDocument('${x.id}')">＋ Upload</button></div><div style="padding:10px">${docList(x,true)}</div></div>`;if(t==='Details')return`<div class="info">${[['Load #',x.load],['Customer',x.customer],['Carrier',x.carrier],['Driver',x.driver],['Driver phone',x.phone],['Equipment',x.equipment],['Pickup',x.pickup],['Delivery',x.delivery],['Status',x.status],['Tracking',x.tracking],['Current location',x.location],['ETA',fmt(x.eta)],['Pickup appointment',fmt(x.pu)],['Delivery appointment',fmt(x.del)],['PO / Reference',x.po],['Scheduling',x.appointment]].map(a=>`<div><label>${esc(a[0])}</label>${esc(a[1]||'—')}</div>`).join('')}</div>`;if(t==='Timeline')return`<div class="timeline">${(x.events||[]).map(e=>`<div class="event"><b>${esc(e[0])}</b><small>${esc(e[1])}</small></div>`).join('')}</div>`;if(t==='Documents')return`<div class="panel" style="box-shadow:none"><div class="panelhead"><b>Shipment documents</b><button class="btn primary sm" onclick="uploadDocument('${x.id}')">＋ Upload document</button></div><div style="padding:10px">${docList(x,false)}</div></div>`;if(t==='Notes')return`<div class="panel" style="box-shadow:none"><div class="panelhead"><b>Support Notes</b><button class="btn sm" onclick="quickNote('${x.id}')">＋ Add note</button></div><div style="padding:10px"><div class="note">${esc(x.notes||'No notes')}</div><div class="note" style="border-left:3px solid var(--red)"><b>Handoff</b><p>${esc(x.handoff||'No handoff')}</p></div></div></div>`;if(t==='Orders')return`<div class="note"><b>Order / PO</b><br>${esc(x.po||'No purchase order recorded')}</div>`;if(t==='Carriers')return`<div class="info"><div><label>Carrier</label>${esc(x.carrier||'—')}</div><div><label>Driver</label>${esc(x.driver||'—')}</div><div><label>Phone</label>${esc(x.phone||'—')}</div><div><label>Equipment</label>${esc(x.equipment||'—')}</div></div>`;if(t==='Contacts')return`<div class="note"><b>Customer</b><br>${esc(x.customer)}</div><div class="note"><b>Driver</b><br>${esc(x.driver||'Not assigned')} • ${esc(x.phone||'No phone')}</div>`;if(t==='Messenger')return`<div class="note">Messaging integration is not faked. Connect an approved provider in production.</div>`;if(t==='Sharing')return`<div class="note">Sharing controls are ready for the authentication/backend layer. Customer-facing access should only expose documents and fields explicitly permitted.</div>`;if(t==='Tasks'){let ts=x.tasks||[];return`<div class="panel" style="box-shadow:none"><div class="panelhead"><b>Tasks</b><button class="btn primary sm" onclick="addTask('${x.id}')">＋ Add task</button></div><div style="padding:10px">${ts.map(t=>`<div class="taskrow"><div class="taskmeta"><b>${esc(t.title)}</b><span class="sub">Load #${esc(x.load)} • ${esc(x.customer)}</span></div><div class="taskactions"><select class="status-select" onchange="setTaskStatus('${x.id}','${t.id}',this.value)">${['Open','In Progress','Blocked','Completed'].map(st=>`<option ${t.status===st?'selected':''}>${st}</option>`).join('')}</select><button class="btn sm" onclick="editTask('${x.id}','${t.id}')">Edit</button></div></div>`).join('')||'<div class="empty">No tasks yet.</div>'}</div></div>`}return''}
function docList(x,summary){let ds=db.documents.filter(d=>d.loadId===x.id);return ds.map(d=>`<div class="doc"><div><b>${esc(d.file)}</b><div class="sub">${esc(d.type)} • ${esc(d.date)} • ${d.visibility==='customer'?'Customer visible':'Internal only'}</div></div><div class="doc-tools">${d.visibility==='internal'?'<span class="doc-visibility internal">Internal</span>':'<span class="doc-visibility">Customer</span>'}<button class="btn sm" onclick="downloadDocument('${d.id}')">Download</button></div></div>`).join('')||'<div class="empty">No documents for this shipment.</div>'}

function editLoad(id){let x=db.loads.find(a=>a.id===id);document.getElementById('mtitle').textContent=`Edit Load #${x.load}`;document.getElementById('mbody').innerHTML=form(x);document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function uploadDocument(loadId=''){let id=loadId||prompt('Load #?');if(!id)return;let x=db.loads.find(a=>a.id===id||a.load===id);if(!x)return alert('Load not found');let type=prompt('Document type: BOL / POD / OTHER / RC / RECEIPT','POD');if(!type)return;type=type.toUpperCase();if(!['BOL','POD','OTHER','RC','RECEIPT'].includes(type))return alert('Use BOL, POD, OTHER, RC or RECEIPT');let visibility=['RC','RECEIPT'].includes(type)?'internal':(prompt('Visibility: CUSTOMER or INTERNAL','CUSTOMER')||'CUSTOMER').toLowerCase()==='internal'?'internal':'customer';let input=document.createElement('input');input.type='file';input.accept='.pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.documents.push({id:'d'+Date.now(),loadId:x.id,load:x.load,type,file:f.name,date:'Just now',data:r.result,mime:f.type,visibility});save();toast(`${type} uploaded`);shipment(x.id)};r.readAsDataURL(f)};input.click()}
function downloadDocument(id){let d=db.documents.find(x=>x.id===id);if(!d?.data)return alert('Document data unavailable');let a=document.createElement('a');a.href=d.data;a.download=d.file;a.click()}
function setLoadStatus(id,status){let x=db.loads.find(a=>a.id===id);if(!x||!STATUS.includes(status))return;let old=x.status;if(old===status)return;x.status=status;x.updated='Just now';x.events=x.events||[];x.events.unshift([`Status changed to ${status}`,'Just now']);save();toast(`Load #${x.load} → ${status}`);if(document.querySelector('.drawer.open'))openDrawer(id)}
function quickLocation(id){let x=db.loads.find(a=>a.id===id);if(!x)return;let n=prompt('Current location:',x.location||'');if(n===null)return;x.location=n.trim();x.updated='Just now';x.events=x.events||[];x.events.unshift([`Current location updated to ${x.location||'Not provided'}`,'Just now']);save();toast('Current location updated');if(location.hash.includes('loads')||location.hash.includes('workbench'))render();else shipment(id)}
function quickNote(id){quickNoteForm(id)}
function addTask(id){let x=db.loads.find(a=>a.id===id);if(!x)return;let title=prompt('Task name:','');if(!title?.trim())return;x.tasks=x.tasks||[];x.tasks.push({id:'t'+Date.now(),title:title.trim(),status:'Open'});x.events=x.events||[];x.events.unshift([`Task added: ${title.trim()}`,'Just now']);save();toast('Task added');shipment(id)}
function editTask(loadId,taskId){let x=db.loads.find(a=>a.id===loadId),t=x?.tasks?.find(a=>a.id===taskId);if(!t)return;let title=prompt('Task name:',t.title);if(title===null)return;if(!title.trim())return;t.title=title.trim();save();shipment(loadId);toast('Task updated')}
function setTaskStatus(loadId,taskId,status){let x=db.loads.find(a=>a.id===loadId),t=x?.tasks?.find(a=>a.id===taskId);if(!t)return;t.status=status;x.events=x.events||[];x.events.unshift([`Task “${t.title}” → ${status}`,'Just now']);save();toast('Task status updated');if(location.hash==='#workbench')render();else shipment(loadId)}
function toggleQuickMenu(){document.getElementById('quickmenu').classList.toggle('open')}
function quickAction(action){document.getElementById('quickmenu').classList.remove('open');let x=db.loads.find(a=>a.id===currentShipmentId);if(!x)return;if(action==='note')quickNoteForm(x.id);if(action==='location')quickLocationForm(x.id);if(action==='status')quickStatusForm(x.id)}

/* Robust Turvo CSV importer: supports comma, semicolon and tab-delimited exports. */
function parseCSV(t){
  t=String(t||'').replace(/^\uFEFF/,'');
  const first=t.split(/\r?\n/,1)[0]||''; const candidates=[',',';','\t']; let delim=candidates[0],best=-1;
  for(const d of candidates){const n=(first.match(new RegExp(d==='\t'?'\\t':d.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&'),'g'))||[]).length;if(n>best){best=n;delim=d}}
  let a=[],r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(ch==='"'&&t[i+1]==='"'){c+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===delim&&!q){r.push(c);c='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))a.push(r);r=[];continue}c+=ch}
  if(c||r.length){r.push(c);if(r.some(x=>x.trim()))a.push(r)} return a;
}

/* ===== BROKERPRO EXCEL / CSV BRIDGE =====
   This is intentionally a flexible browser-side import/export layer.

const BROKERPRO_FIELDS={
  load:['Load #','Load','Load Number','Shipment','Shipment #','Shipment Number','Order #','Order Number'],
  customer:['Customer','Customer Name','Client','Account'],
  carrier:['Carrier','Carrier Name','Vendor'],
  driver:['Driver','Driver Name'], phone:['Driver Phone','Driver Phone Number','Phone'],
  equipment:['Equipment','Equipment Type','Trailer Type'],
  pickup:['Pickup','Origin','Pickup Location','Origin Location','PU Location'],
  delivery:['Delivery','Destination','Delivery Location','Destination Location','DEL Location'],
  pu:['Pickup Appointment','Pickup Appt','PU Appointment','Pickup Date'],
  del:['Delivery Appointment','Delivery Appt','DEL Appointment','Delivery Date'],
  status:['Status','Load Status','Shipment Status'], tracking:['Tracking','Tracking Status','Tracking State'],
  location:['Current Location','Location','Last Location'], eta:['ETA','Estimated Time of Arrival'],
  notes:['Notes','Comments','Support Notes'], handoff:['Handoff','Handoff Notes'],
  po:['PO','PO #','Reference','Reference Number','Customer Reference'],
  value:['Customer Bill','Customer Bill Amount','Customer Rate','Revenue'],
  carrierPay:['Carrier Pay','Carrier Payable','Carrier Rate','Cost'], appointment:['Appointment','Scheduling','Scheduling Type']
};
function openBrokerProImport(){const el=document.getElementById('brokerProFile');if(el){el.value='';el.click()}}
function brokerCell(row,aliases){const keys=Object.keys(row||{});for(const a of aliases){const k=keys.find(x=>norm(x)===norm(a));if(k!=null&&row[k]!=null&&String(row[k]).trim()!=='')return row[k]}return ''}
function brokerMoney(v){return Number(String(v??'').replace(/[$,]/g,'').trim())||0}
function brokerDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&window.XLSX?.SSF?.parse_date_code){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}T${String(d.H||0).padStart(2,'0')}:${String(d.M||0).padStart(2,'0')}`}
  return String(v).trim();
}
function brokerProRowToLoad(row,index){
  const v=k=>brokerCell(row,BROKERPRO_FIELDS[k]||[]), load=String(v('load')||'').trim(); if(!load)return null;
  const customer=String(v('customer')||'Unknown').trim(), value=brokerMoney(v('value')), carrierPay=brokerMoney(v('carrierPay'));
  return {id:'bp'+Date.now()+index,load,customer,carrier:String(v('carrier')||''),driver:String(v('driver')||''),phone:String(v('phone')||''),equipment:String(v('equipment')||'Dry Van'),pickup:String(v('pickup')||''),delivery:String(v('delivery')||''),pu:brokerDate(v('pu')),del:brokerDate(v('del')),status:normalizeStatus(v('status')),tracking:normalizeTracking(v('tracking')),location:String(v('location')||''),eta:brokerDate(v('eta')),notes:String(v('notes')||''),handoff:String(v('handoff')||''),updated:'Imported from BrokerPro',events:[['Imported from BrokerPro','Just now']],po:String(v('po')||''),value,carrierPay,margin:value-carrierPay,appointment:String(v('appointment')||''),tasks:[{id:'bp-task-'+Date.now()+index,title:'Review BrokerPro import',status:'Open'}]};
}
async function importBrokerProFile(event){
  const file=event.target.files?.[0]; if(!file)return;
  try{
    if(!window.XLSX)throw new Error('Excel library is not available. Connect to the internet once so the SheetJS CDN can load.');
    const ext=(file.name.split('.').pop()||'').toLowerCase(); if(!['xlsx','xls','csv'].includes(ext))throw new Error('Please select an Excel (.xlsx/.xls) or CSV file.');
    const data=await file.arrayBuffer(), wb=XLSX.read(data,{type:'array',cellDates:false}), ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}); if(!rows.length)throw new Error('No data rows were found in the first worksheet.');
    const seen=new Set(db.loads.map(x=>String(x.load).trim())), added=[]; let skipped=0;
    rows.forEach((row,i)=>{const x=brokerProRowToLoad(row,i);if(!x||seen.has(String(x.load).trim())){skipped++;return}db.loads.unshift(x);seen.add(String(x.load).trim());added.push(x);
      if(x.customer&&!db.customers.some(c=>String(c.name).toLowerCase()===x.customer.toLowerCase()))db.customers.push({name:x.customer,code:x.customer.slice(0,3).toUpperCase(),tracking:'',equipment:'',docs:'',instructions:'Imported from BrokerPro',phone:''});
      if(x.carrier&&!db.carriers.includes(x.carrier))db.carriers.push(x.carrier);
    });
    save(); render(); toast(`${added.length} BrokerPro load(s) imported • ${skipped} skipped`);
  }catch(err){toast(`BrokerPro import: ${err.message||err}`)} finally{event.target.value=''}
}

const WB_STATUSES=['ARRIVED@PU?','LOADED?','LOCATION?','In transit','ARRIVED@DEL?','DEL?','DELAYED','POD PENDING','BACK to OPS'];
const WB_VISIBILITY=['Seniors','Elite 1','Elite 2','Elite 3','Elite 4'];
const WB_SYNC_ENDPOINTS={from:'',to:''}; // Real BrokerPro sync requires authenticated backend.
function wbNormalize(x){
 if(!x.wbStatus)x.wbStatus=WB_STATUSES.includes(x.status)?x.status:(String(x.status).toLowerCase()==='delayed'?'DELAYED':'In transit');
 // Migrate previous version's queue visibility labels without dropping saved loads.
 if(!x.groupVisibility||x.groupVisibility==='Support Layer')x.groupVisibility=WB_VISIBILITY.includes(x.eliteTeam)?x.eliteTeam:'Elite 1';
 if(x.groupVisibility==='Seniors Only')x.groupVisibility='Seniors';
 if(!WB_VISIBILITY.includes(x.groupVisibility))x.groupVisibility=WB_VISIBILITY.includes(x.eliteTeam)?x.eliteTeam:'Elite 1';
 if(x.milesOut===undefined)x.milesOut='';
 if(x.taskExpiration===undefined)x.taskExpiration='';
 if(x.activeTask===undefined)x.activeTask=(x.tasks||[]).find(t=>t.status!=='Completed')?.title||'';
}
function wbCanSee(x){
 if(!currentUser)return false;
 wbNormalize(x);
 // Senior can inspect all authorized Elite teams; support sees only its assigned queue.
 if(currentUser.senior)return masterTeam==='All Teams'||x.eliteTeam===masterTeam;
 return x.groupVisibility===currentUser.team;
}
function wbLog(x,label){x.events=x.events||[];x.events.unshift([label,new Date().toLocaleString()]);x.updated=new Date().toLocaleString();}
function wbUpdate(id,field,value){
 const x=db.loads.find(y=>String(y.id)===String(id));
 if(!x||!wbCanSee(x))return;
 if(!['wbStatus','location','milesOut','taskExpiration','groupVisibility','activeTask'].includes(field))return;
 if(field==='groupVisibility'&&!WB_VISIBILITY.includes(value))return;
 if(field==='wbStatus'&&!WB_STATUSES.includes(value))return;
 if(field==='milesOut'&&value!==''&&(!Number.isFinite(Number(value))||Number(value)<0)){toast('Enter valid miles');wbRenderRows();return;}
 if(field==='taskExpiration'&&value&&!Number.isFinite(new Date(value).getTime()))return;
 const old=x[field];if(old===value)return;
 x[field]=value;
 if(field==='wbStatus')x.status=value;
 wbLog(x,field+': '+String(old??'—')+' → '+String(value||'—'));
 save();
 // Rebuild sections when an item changes queue or time priority.
 if(['wbStatus','groupVisibility','taskExpiration'].includes(field))wbRenderRows();
 else wbRefreshExpiration();
}
function wbEscapeId(x){return JSON.stringify(String(x.id)).replace(/"/g,'&quot;');}

 const tx=x.taskExpiration?new Date(x.taskExpiration).getTime():Infinity;
 const ty=y.taskExpiration?new Date(y.taskExpiration).getTime():Infinity;
 return (Number.isFinite(tx)?tx:Infinity)-(Number.isFinite(ty)?ty:Infinity) || String(x.load).localeCompare(String(y.load),undefined,{numeric:true});
});}

async function wbSync(direction){
 const endpoint=WB_SYNC_ENDPOINTS[direction],el=document.getElementById('wbSyncStatus');
 if(!currentUser?.senior){toast('Senior permission required for synchronization');return;}
 if(!endpoint){if(el)el.textContent='Demo only • no BrokerPro server configured';toast('BrokerPro sync simulated; no remote data transferred');return;}
 if(el)el.textContent='Connecting to BrokerPro...';
 try{
 const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({direction,loads:direction==='to'?db.loads:undefined})});
 if(!response.ok)throw Error('HTTP '+response.status);
 const result=await response.json();
 if(direction==='from'){
 if(!Array.isArray(result.loads))throw Error('Invalid response');
 let count=0;
 for(const incoming of result.loads){if(!incoming.load)continue;const old=db.loads.find(x=>String(x.load)===String(incoming.load));if(old){Object.assign(old,incoming);wbNormalize(old);}else{const item={...incoming,id:incoming.id||'bp'+Date.now()+'_'+count++};wbNormalize(item);db.loads.push(item);}}
 save();wbRenderRows();
 }
 if(el)el.textContent='Sync completed • '+new Date().toLocaleTimeString();toast('BrokerPro sync completed');
 }catch(e){if(el)el.textContent='Sync failed: '+e.message;toast('BrokerPro synchronization failed');}
}

function tbMigrate(){
 let changed=false;
 for(const x of db.loads){
  wbNormalize(x);x.tasks=Array.isArray(x.tasks)?x.tasks:[];
  if(x.tbV5Migrated)continue;
  let open=x.tasks.find(t=>t.status!=='Completed');
  if(open&&x.activeTask&&String(open.title||'').trim()!==String(x.activeTask).trim())open.title=String(x.activeTask).trim();
  if(!open&&x.activeTask&&x.status!=='Delivered'){
   open={id:'t-v5-'+String(x.id),title:String(x.activeTask),status:'Open'};x.tasks.push(open);
  }
  if(!open&&!x.tasks.length&&x.status!=='Delivered'){
   open={id:'t-v5-'+String(x.id),title:'Confirm shipment status and next milestone',status:'Open'};x.tasks.push(open);
  }
  x.tasks.forEach(t=>{
   if(!t.id)t.id='t-'+String(x.id)+'-'+Math.random().toString(36).slice(2,8);
   if(t.due===undefined)t.due=x.taskExpiration||'';
   if(!t.visibility)t.visibility=x.groupVisibility||x.eliteTeam||'Elite 1';
   if(t.description===undefined)t.description='';
  });
  x.tbV5Migrated=true;changed=true;
 }
 if(changed)save();
}

function tbFindTask(loadId,taskId){const x=db.loads.find(a=>String(a.id)===String(loadId));return{x,t:x?.tasks?.find(a=>String(a.id)===String(taskId))};}
function tbCloseTaskPanel(){tbSelected=null;document.getElementById('tbTaskSide')?.classList.remove('open');tbMarkSelected();}
function tbEnsurePanels(){
 if(!document.getElementById('tbTaskSide')){
 const d=document.createElement('aside');d.id='tbTaskSide';d.className='tb-side';d.setAttribute('aria-label','Task details');document.body.appendChild(d);
 }
 if(!document.getElementById('tbFloatBtn')){
 const f=document.createElement('button');f.type='button';f.id='tbFloatBtn';f.className='tb-fab';f.textContent='＋';f.title='Quick shipment actions';f.setAttribute('aria-label','Quick shipment actions');f.onclick=tbToggleFloat;document.body.appendChild(f);
 const m=document.createElement('div');m.id='tbFloatMenu';m.className='tb-fabmenu';document.body.appendChild(m);

}
function tbOpenTask(loadId,taskId){
 const {x,t}=tbFindTask(loadId,taskId);if(!x||!t||!tbTaskVisible(x,t)){toast('Task not available to this role');return;}
 tbEnsurePanels();tbSelected={loadId:String(loadId),taskId:String(taskId)};
 tbPanelRender(x,t,false);tbMarkSelected();
}
function tbOpenNewTask(loadId){

 tbEnsurePanels();tbSelected={loadId:String(loadId),taskId:null};tbPanelRender(x,{title:'',description:'',due:'',visibility:currentUser.senior?(x.groupVisibility||x.eliteTeam):currentUser.team,status:'Open'},true);

 <div class="tb-side-footer"><button class="btn primary" onclick="tbSavePanel()">${isNew?'Create task':'Save task'}</button>${isNew?'':`<button class="btn" onclick="tbComplete(${a},${b})">${t.status==='Completed'?'↻ Reopen':'✓ Complete'}</button>`}<button class="btn" onclick="tbOpenNewTask(${a})">＋ Add</button></div>`;

function tbSavePanel(){
 if(!tbSelected)return;
 const x=db.loads.find(a=>String(a.id)===tbSelected.loadId);if(!x)return;
 const title=document.getElementById('tbTitle')?.value.trim();if(!title){toast('Enter a task title');return;}
 const description=document.getElementById('tbDescription').value;
 const due=document.getElementById('tbDue').value;
 const visibility=document.getElementById('tbVis').value;
 const status=document.getElementById('tbState').value;
 if(!currentUser?.senior&&visibility!==currentUser?.team){toast('Not authorized for that team');return;}
 let task;if(tbSelected.taskId){task=x.tasks.find(t=>String(t.id)===tbSelected.taskId);if(!task||!tbTaskVisible(x,task))return;}
 else{task={id:'task-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)};x.tasks.push(task);tbSelected.taskId=String(task.id);}
 Object.assign(task,{title,description,due,visibility,status});
 if(x.tasks.find(t=>t.status!=='Completed')===task||x.tasks[0]===task){x.activeTask=title;x.taskExpiration=due;x.groupVisibility=visibility;}
 wbLog(x,'Task saved: '+title);save();toast('Task saved');
 if(!tbTaskVisible(x,task)){tbCloseTaskPanel();tbUpdateViews();return;}
 tbUpdateViews();tbPanelRender(x,task,false);
}
function tbInlineSave(loadId,taskId,raw){
 const{x,t}=tbFindTask(loadId,taskId);if(!x||!t||!tbTaskVisible(x,t))return;
 const title=String(raw||'').trim();if(!title)return;
 if(t.title===title)return;
 t.title=title;
 if(x.tasks.find(a=>a.status!=='Completed')===t)x.activeTask=title;
 wbLog(x,'Task text updated');save();
 if(tbSelected?.taskId===String(taskId))document.getElementById('tbTitle').value=title;
 tbUpdateViews(false);
}
function tbComplete(loadId,taskId){
 const{x,t}=tbFindTask(loadId,taskId);if(!x||!t||!tbTaskVisible(x,t))return;
 t.status=t.status==='Completed'?'Open':'Completed';
 if(t.status==='Completed'&&x.activeTask===t.title)x.activeTask=x.tasks.find(y=>y.status!=='Completed')?.title||'';
 wbLog(x,(t.status==='Completed'?'Task completed: ':'Task reopened: ')+t.title);
 save();toast(t.status==='Completed'?'Task completed':'Task reopened');
 const sideOpen=tbSelected?.taskId===String(taskId);
 tbUpdateViews();
 if(sideOpen)tbPanelRender(x,t,false);
}

/* ===== v8 | ROUTE COMPLETE / COMPLETED LOADS / BROKER-CARRIER-DRIVER ===== */
/* This is local prototype state only. Real carrier/broker contact records and completed route
   synchronization require an authenticated BrokerPro backend. */
function jbcRouteIsComplete(x){return !!x&&(x.routeComplete===true||x.wbStatus==='Route Complete'||(!x.routeComplete&&x.status==='Delivered'));}
function jbcCompleteStamp(x){
 if(!x.completedAt)return 'Completion time not recorded';
 const d=new Date(x.completedAt);return isNaN(d)?String(x.completedAt):d.toLocaleString();
}
function jbcCanAccessShipment(x){return !!x&&tbAccessibleLoad(x);}
function jbcRouteSetComplete(loadId,complete){
 const x=db.loads.find(y=>String(y.id)===String(loadId));
 if(!jbcCanAccessShipment(x)){toast('Shipment access denied');return false;}
 if(complete){
  if(jbcRouteIsComplete(x)){toast('Route already completed');return false;}
  if(!confirm('Mark route #'+x.load+' complete? It will move to Completed Loads, and its tasks and history will be preserved.'))return false;
  x.routeComplete=true;x.completedAt=new Date().toISOString();x.wbStatus='Route Complete';x.status='Delivered';
  wbLog(x,'Route Complete — shipment moved to Completed Loads');
 }else{
  if(!jbcRouteIsComplete(x))return false;
  if(!confirm('Reopen route #'+x.load+' and return its tasks to the active Workbench?'))return false;
  x.routeComplete=false;x.completedAt='';x.wbStatus='In transit';x.status='In Transit';
  wbLog(x,'Route reopened — returned to active Workbench');
 }
 save();tbCloseTaskPanel();tbToggleFloat(false);
 toast(complete?'Route completed and archived':'Route reopened');
 if(document.getElementById('stabs')&&String(currentShipmentId)===String(x.id))shipment(x.id);
 else if(location.hash==='#completed')jbcShowCompletedLoads();
 else if(document.getElementById('tbRowsHost'))tbRenderSections();
 return true;
}
/* A completed route is not an active Workbench task. Task records are preserved for shipment history. */
const jbcPriorAllTasks=tbAllTasks;
tbAllTasks=function(){return jbcPriorAllTasks().filter(({x})=>!jbcRouteIsComplete(x));};
const jbcPriorFloatMenu=tbRenderFloatMenu;
tbRenderFloatMenu=function(){
 jbcPriorFloatMenu();
 const x=db.loads.find(y=>String(y.id)===String(currentShipmentId));
 const menu=document.getElementById('tbFloatMenu');if(!menu||!x)return;
 const picker=menu.querySelector('select[aria-label="Shipment status"]');
 if(jbcRouteIsComplete(x)){
  picker?.remove();
  const label=document.createElement('div');label.className='tb-route-banner';
  label.style.margin='7px 0';label.textContent='✓ Route Complete';menu.appendChild(label);
  const reopen=document.createElement('button');reopen.type='button';reopen.textContent='↻ Reopen route';
  reopen.onclick=()=>jbcRouteSetComplete(x.id,false);menu.appendChild(reopen);
  const completed=document.createElement('button');completed.type='button';completed.textContent='✓ View Completed Loads';
  completed.onclick=()=>go('completed');menu.appendChild(completed);
 }else if(picker){
  const option=document.createElement('option');option.value='Route Complete';option.textContent='✓ Route Complete';picker.appendChild(option);
 }
};

 if(status==='Route Complete')return jbcRouteSetComplete(id,true);

/* The legacy Edit Shipment form rebuilds its load object; restore these newer fields afterward. */
const jbcPriorSaveLoad=saveLoad;
saveLoad=function(event){
 const id=document.getElementById('fid')?.value;
 const old=db.loads.find(x=>String(x.id)===String(id));
 const fields=['routeComplete','completedAt','wbStatus','eliteTeam','groupVisibility','milesOut','activeTask','taskExpiration','tasks','tbV5Migrated','brokerName','brokerContact','brokerPhone','brokerEmail','carrierDispatcher','carrierPhone','carrierEmail','driverEmail'];
 const retain=old?Object.fromEntries(fields.map(k=>[k,old[k]])):null;
 const result=jbcPriorSaveLoad(event);
 if(retain){const fresh=db.loads.find(x=>String(x.id)===String(id));if(fresh){for(const k of fields)if(retain[k]!==undefined)fresh[k]=retain[k];save();}}
 return result;
};
function jbcShowCompletedLoads(){
 if(!currentUser)return;
 tbShipmentMode=false;tbFloat(false);tbCloseTaskPanel();
 document.querySelectorAll('.nav button[data-p]').forEach(el=>el.classList.toggle('active',el.dataset.p==='completed'));
 const term=String(document.getElementById('jbcCompletedSearch')?.value||'').toLowerCase();
 let rows=db.loads.filter(x=>jbcRouteIsComplete(x)&&jbcCanAccessShipment(x));
 if(term)rows=rows.filter(x=>[x.load,x.customer,x.carrier,x.driver,x.eliteTeam].some(v=>String(v||'').toLowerCase().includes(term)));
 rows.sort((a,b)=>(Date.parse(b.completedAt)||0)-(Date.parse(a.completedAt)||0));
 const app=document.getElementById('app');

  const rows=wbRows(),c={all:rows.length,overdue:0,blocked:0,delayed:0,unassigned:0};
  rows.forEach(r=>{const k=wbCls(r);for(const n in k)if(k[n])c[n]++;r.style.display=(wbF==='all'||k[wbF])?'':'none'});
  const strip=$('v10wb');if(strip)strip.innerHTML=[['all','All tasks'],['overdue','Overdue'],['blocked','Blocked'],['delayed','Delayed loads'],['unassigned','Unassigned']].map(([k,l])=>`<button class="v10-chip ${wbF===k?'on':''} ${k==='overdue'||k==='blocked'||k==='delayed'?'red':''}" data-f="${k}">${l}<b>${c[k]}</b></button>`).join('');

let wbBusy=false;

  wbApply()}catch(e){console.warn('v10 wb',e)}finally{wbBusy=false}}
const appEl=$('app');if(appEl){const mo=new MutationObserver(()=>{mo.disconnect();wbSync();mo.takeRecords();mo.observe(appEl,{childList:true,subtree:true})});mo.observe(appEl,{childList:true,subtree:true})}

 <section class="j21-card" style="grid-column:1/-1"><h3>Route stops (${stops.length}) · pickup, intermediates and delivery</h3><div class="j21-grid2" id="j21StopsEditor">${j21StopEditors(x,own)}</div>${own?`<div class="j21-ops-mini" style="margin-top:12px"><button class="btn sm" onclick="j21AddStop(${j21Id(x.id)})">＋ Add intermediate stop</button><button class="btn sm" onclick="j21OpenMaps(${j21Id(x.id)})">↗ Open all stops in Google Maps</button></div>`:''}<div class="j21-editor-note">Addresses are used in the Google Maps route. Pickup / delivery completion changes the circle state.</div></section></div>`}
function j21StopEditors(x,own){return j21Stops(x).map((s,i)=>`<section class="j21-card" style="background:#fbfdfe" data-stop="${i}"><div class="j21-toolbar"><b>${i===0?'🟢 Pickup':i===x.stops.length-1?'🔴 Delivery':'🔵 Stop '+(i+1)}</b>${own&&i>0&&i<x.stops.length-1?`<button class="btn sm danger" onclick="j21RemoveStop(${j21Id(x.id)},${i})">Remove stop</button>`:''}</div><div class="j21-field"><label>Facility / stop name</label><input data-sk="name" value="${j21Esc(s.name)}" ${own?'':'readonly'}></div><div class="j21-field"><label>Full address · street / city / state / ZIP</label><input data-sk="address" value="${j21Esc(s.address)}" ${own?'':'readonly'}></div><div class="j21-field"><label>Appointment (type or use calendar / time picker)</label><input data-sk="appointment" type="datetime-local" value="${j21Esc(s.appointment)}" ${own?'':'readonly'}></div><div class="j21-field"><label>Stop status</label><select data-sk="done" ${own?'':'disabled'}><option value="false" ${s.done?'':'selected'}>Pending</option><option value="true" ${s.done?'selected':''}>Completed</option></select></div></section>`).join('')}

async function j21RefreshCarrierView(id){
 const x=j21Get(id);if(!x||!tbAccessibleLoad(x))return toast('Shipment unavailable');
 if(!J21_API.carrierViewTrackingEndpoint)return toast('Carrier View connection is not configured. No live data was retrieved.');
 try{
  const url=J21_API.carrierViewTrackingEndpoint+'?load='+encodeURIComponent(x.load);
  const r=await fetch(url,{credentials:'include',headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);
  const payload=await r.json();if(!payload||typeof payload!=='object')throw new Error('Invalid response');
  // The backend must authenticate, authorize, normalize timestamps, and validate location sources.
  if(payload.milesOut!==undefined){const v=Number(payload.milesOut);if(Number.isFinite(v)&&v>=0)x.milesOut=v;}
  if(typeof payload.currentLocation==='string')x.location=payload.currentLocation;
  if(typeof payload.eta==='string'&&!Number.isNaN(Date.parse(payload.eta)))x.eta=payload.eta.slice(0,16);
  if(typeof payload.lastUpdate==='string')x.trackingUpdatedAt=payload.lastUpdate;
  wbLog(x,'Carrier View tracking refreshed via approved backend');save();shipment(id);j21SetTab('Details');toast('Carrier View tracking refreshed');

function j21EstimateETA(){const mi=Number(document.getElementById('j21-milesOut')?.value),mph=Number(document.getElementById('j21-speed')?.value);if(!Number.isFinite(mi)||mi<0||!Number.isFinite(mph)||mph<10||mph>80)return toast('Enter miles and planning speed (10–80 mph)');const d=new Date(Date.now()+mi/mph*3600000);const n=v=>String(v).padStart(2,'0');const local=`${d.getFullYear()}-${n(d.getMonth()+1)}-${n(d.getDate())}T${n(d.getHours())}:${n(d.getMinutes())}`;document.getElementById('j21-eta').value=local;toast('Planning ETA calculated. Save all changes to keep it. Not live Carrier View data.');}
function j21SaveDetails(id){if(!j21CanEdit())return toast('Operations/Accounting permission required');const x=j21Get(id);if(!x)return;const f=k=>document.getElementById('j21-'+k)?.value??'';const oldNo=x.load;const newNo=f('load').trim();if(!newNo)return toast('Load number is required');if(currentUser?.role==='Operations'&&f('eliteTeam')!==currentUser.team)return toast('Operations demo users can only edit loads for their own Elite team');if(db.loads.some(y=>String(y.id)!==String(id)&&y.load===newNo))return toast('Load number already exists');
 const s=j21CaptureStops();if(s.length<2||!s[0].address||!s.at(-1).address)return toast('Pickup and delivery addresses are required');for(const st of s){if(st.appointment&&!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(st.appointment))return toast('Enter a valid stop appointment')}
 const bill=Number(f('value')),pay=Number(f('carrierPay'));if(!Number.isFinite(bill)||!Number.isFinite(pay)||bill<0||pay<0)return toast('Enter valid nonnegative financial amounts');if(f('milesOut')!==''&&(!Number.isFinite(Number(f('milesOut')))||Number(f('milesOut'))<0))return toast('Miles out must be positive');
 const keys=['load','customer','po','equipment','brokerName','brokerContact','brokerPhone','carrier','dispatcher','driver','phone','location','milesOut','eta','trackingUrl','appointment','handoff'];keys.forEach(k=>x[k]=f(k));
 x.value=bill;x.carrierPay=pay;x.margin=bill-pay;x.opsStatus=f('opsStatus');x.billingStatus=f('billingStatus');x.eliteTeam=f('eliteTeam');x.owner=f('owner').trim();x.assignedGroups=[...document.querySelectorAll('.j21-group:checked')].map(e=>e.value);x.assignedUsers=f('users').split(',').map(v=>v.trim()).filter(Boolean);x.stops=s;x.pickup=s[0].address;x.delivery=s.at(-1).address;x.pu=s[0].appointment;x.del=s.at(-1).appointment;
 x.status={'At pickup':'At Pickup','Picked up':'Loaded','En route':'In Transit','At delivery':'At Delivery','Route complete':'Delivered'}[x.opsStatus]||x.opsStatus;x.routeComplete=x.opsStatus==='Route complete';if(x.routeComplete)x.completedAt=x.completedAt||new Date().toISOString();else x.completedAt='';
 x.wbStatus=x.opsStatus==='Route complete'?'Route Complete':x.opsStatus==='On Hold'?'DELAYED':x.wbStatus;
 wbLog(x,'Operations/Details saved'+(oldNo===x.load?'':' · load # changed'));save();toast('Shipment details saved');shipment(x.id);j21SetTab('Details');}
function j21SetTab(tab){const x=j21Get(currentShipmentId);if(!x)return;document.querySelectorAll('#stabs button').forEach(b=>b.classList.toggle('active',b.textContent.trim()===tab));const body=document.getElementById('stabbody');if(body)body.innerHTML=stabhtml(x,tab)}
const j21OldStabhtml=stabhtml;stabhtml=function(x,tab){j21Norm(x);if(tab==='Summary')return j21Summary(x);if(tab==='Details')return j21Details(x);if(tab==='Timeline')return `<div class="j21-summary"><section class="j21-summary-card" style="grid-column:span 2"><h3>Route stops</h3>${j21Timeline(x)}</section><section class="j21-summary-card" style="grid-column:span 2"><h3>Shipment events</h3>${(x.events||[]).map(a=>j21Fact(a[1],a[0])).join('')||'No events'}</section></div>`;return j21OldStabhtml(x,tab)};

 const app=document.getElementById('app');app.querySelectorAll('.v10-stepper,.v10-kpis').forEach(el=>el.remove());const legacy=app.querySelector('.title');legacy?.remove();const shell=app.querySelector('.shipment');if(!shell)return;shell.classList.add('j21-ship');const old=shell.querySelector('.shiptop');if(old)old.outerHTML=j21ShipHero(x);const tabs=shell.querySelector('#stabs');if(tabs)tabs.classList.add('j21-tabs');const body=shell.querySelector('#stabbody');if(body)body.classList.add('j21-body');const active=tabs?.querySelector('.active')?.textContent?.trim()||'Summary';if(body)body.innerHTML=stabhtml(x,active);

tails ↗</button></td></tr>`).join('')}</tbody></table></div></section>`}
